name: iOS unsigned IPA for personal testing

# Manual only. Adding this file does not upload source or start a build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: false
      - name: Record build tools
        run: |
          xcodebuild -version
          flutter --version
      - name: Build device app and unsigned IPA
        run: python3 scripts/prepare_ios.py unsigned-ipa --mode release --output artifacts/ios/Horizon-Link-unsigned.ipa
      - name: Record checksum
        run: shasum -a 256 artifacts/ios/Horizon-Link-unsigned.ipa > artifacts/ios/Horizon-Link-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-Link-unsigned-iPhone-${{ github.run_number }}
          path: |
            artifacts/ios/Horizon-Link-unsigned.ipa
            artifacts/ios/Horizon-Link-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 3
